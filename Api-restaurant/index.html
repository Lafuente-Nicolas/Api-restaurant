<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Restaurant Gourmet - Gestion</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800">

    <!-- HERO -->
    <section class="relative bg-cover bg-center h-[70vh]" style="background-image: url('img/pizzeria.jpg');">
        <div class="absolute inset-0 bg-black bg-opacity-50 flex flex-col justify-center items-center text-white px-4 text-center">
            <h1 class="text-5xl md:text-7xl font-bold mb-4">Bienvenue au Gourmet</h1>
            <p class="text-xl md:text-2xl mb-8">Savourez une expérience culinaire unique</p>
            <a href="#menu" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded text-lg">Découvrir notre menu</a>
        </div>
    </section>

    <!-- MENU -->
    <section id="menu" class="py-16 px-4 max-w-6xl mx-auto">
        <h2 class="text-4xl font-bold text-center mb-12">Notre Menu</h2>
        <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Les plats seront insérés ici -->
        </div>
        <div class="text-center mt-8">
            <button id="loadArticlesBtn" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded text-lg">Charger les plats</button>
        </div>
    </section>

    <!-- CLIENTS -->
    <section id="clients" class="py-16 px-4 max-w-6xl mx-auto">
        <h2 class="text-4xl font-bold text-center mb-8">Ajouter un client</h2>
        <form id="addClientForm" class="max-w-xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
            <input type="text" id="nom" placeholder="Nom *" class="border p-3 rounded" required />
            <input type="text" id="prenom" placeholder="Prénom *" class="border p-3 rounded" required />
            <input type="text" id="telephone" placeholder="Téléphone *" class="border p-3 rounded" required />
            <input type="email" id="email" placeholder="Email *" class="border p-3 rounded" required />
            <input type="text" id="numeroDeRue" placeholder="Numéro de rue" class="border p-3 rounded" />
            <input type="text" id="nomDeRue" placeholder="Nom de rue" class="border p-3 rounded" />
            <input type="text" id="codePostal" placeholder="Code postal" class="border p-3 rounded" />
            <input type="text" id="ville" placeholder="Ville" class="border p-3 rounded" />
            <div class="md:col-span-2 text-right">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded">Ajouter le client</button>
            </div>
        </form>
    </section>

    <!-- COMMANDES -->
    <section id="orders" class="py-16 px-4 max-w-6xl mx-auto">
        <h2 class="text-4xl font-bold text-center mb-8">Créer une commande</h2>
        <form id="createOrderForm" class="max-w-lg mx-auto grid gap-6">
            <input type="number" id="clientId" placeholder="ID Client *" class="border p-3 rounded" required />
            <input type="text" id="articleIds" placeholder="IDs Articles (séparés par des virgules) *" class="border p-3 rounded" required />
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded">Créer la commande</button>
        </form>

        <div class="mt-12 max-w-lg mx-auto">
            <h3 class="text-2xl font-semibold mb-4">Consulter les Commandes d'un client</h3>
            <form id="fetchOrdersForm" class="flex gap-4 mb-6">
                <input type="number" id="fetchClientId" placeholder="ID Client" class="border p-3 rounded flex-grow" required />
                <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-3 rounded">Afficher commandes</button>
            </form>
            <ul id="ordersList" class="list-disc pl-5 space-y-2 text-gray-700"></ul>
        </div>
    </section>

    <footer class="bg-gray-800 text-white text-center py-6">
        <p>&copy; 2025 Restaurant Gourmet. Tous droits réservés.</p>
    </footer>

    <script>
        const apiUrl = "https://localhost:7074"; // Mets ton URL backend ici

        // Fonction pour charger les plats (articles) depuis API
        async function loadArticles() {
            const btn = document.getElementById('loadArticlesBtn');
            btn.disabled = true;
            btn.textContent = 'Chargement...';

            try {
                const res = await fetch(`${apiUrl}/articles`);
                if (!res.ok) throw new Error('Erreur API lors du chargement des articles');
                const articles = await res.json();

                const container = document.getElementById('articlesGrid');
                container.innerHTML = ''; // Clear

                articles.forEach(a => {
                    // imageUrl attendue dans l'objet article, sinon fallback
                    const imageUrl = 'img/pizza.webp';


                    const articleHTML = `
                  <div class="bg-white rounded shadow overflow-hidden flex flex-col">
                    <img src="${imageUrl}" alt="${a.nom}" class="w-full h-48 object-cover" />
                    <div class="p-4 flex-grow flex flex-col justify-between">
                      <div>
                        <h3 class="text-xl font-semibold mb-2">${a.nom}</h3>
                        <p class="text-gray-600 mb-4">${a.categorie ?? ''}</p>
                      </div>
                      <div class="text-red-600 font-bold text-lg">${a.prix.toFixed(2)} €</div>
                    </div>
                  </div>
                `;
                    container.insertAdjacentHTML('beforeend', articleHTML);
                });
            } catch (error) {
                alert(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Charger les plats';
            }
        }

        document.getElementById('loadArticlesBtn').addEventListener('click', loadArticles);

        // Ajout client
        document.getElementById('addClientForm').addEventListener('submit', async e => {
            e.preventDefault();
            const client = {
                nom: document.getElementById('nom').value.trim(),
                prenom: document.getElementById('prenom').value.trim(),
                telephone: document.getElementById('telephone').value.trim(),
                email: document.getElementById('email').value.trim(),
                numeroDeRue: document.getElementById('numeroDeRue').value.trim(),
                nomDeRue: document.getElementById('nomDeRue').value.trim(),
                codePostal: document.getElementById('codePostal').value.trim(),
                ville: document.getElementById('ville').value.trim(),
            };

            try {
                const res = await fetch(`${apiUrl}/clients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(client),
                });
                if (!res.ok) throw new Error('Erreur lors de l\'ajout du client');
                alert('Client ajouté !');
                e.target.reset();
            } catch (error) {
                alert(error.message);
            }
        });

        // Création commande
        document.getElementById('createOrderForm').addEventListener('submit', async e => {
            e.preventDefault();
            const clientId = parseInt(document.getElementById('clientId').value);
            const articleIdsRaw = document.getElementById('articleIds').value;
            const articleIds = articleIdsRaw.split(',').map(id => parseInt(id.trim())).filter(id => !isNaN(id));

            if (!clientId || articleIds.length === 0) {
                alert('Merci de renseigner un ID client valide et au moins un ID article.');
                return;
            }

            const dto = {
                clientsId: clientId,
                articleIds: articleIds,
            };

            try {
                const res = await fetch(`${apiUrl}/api/commandes/creation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto),
                });
                if (!res.ok) {
                    const errData = await res.json().catch(() => null);
                    throw new Error(errData?.message || 'Erreur lors de la création de la commande');
                }
                alert('Commande créée !');
                e.target.reset();
            } catch (error) {
                alert(error.message);
            }
        });

        // Afficher commandes d’un client
        document.getElementById('fetchOrdersForm').addEventListener('submit', async e => {
            e.preventDefault();
            const clientId = parseInt(document.getElementById('fetchClientId').value);
            if (!clientId) {
                alert('Merci de renseigner un ID client valide.');
                return;
            }

            try {
                const res = await fetch(`${apiUrl}/api/commandes/client?clientId=${clientId}`);
                if (!res.ok) throw new Error('Erreur lors du chargement des commandes du client');
                const commandes = await res.json();

                const list = document.getElementById('ordersList');
                list.innerHTML = '';

                if (commandes.length === 0) {
                    list.innerHTML = '<li>Aucune commande trouvée pour ce client.</li>';
                    return;
                }

                commandes.forEach(cmd => {
                    const dateFormatted = new Date(cmd.date).toLocaleString('fr-FR');
                    const montant = cmd.montantTotal?.toFixed(2) || '0.00';
                    const statut = cmd.statutLivraison || 'Non défini';

                    list.innerHTML += `
                <li class="bg-gray-100 p-3 rounded mb-2">
                    <strong>Commande #${cmd.id}</strong><br>
                     Date: ${dateFormatted}<br>
                     Montant: ${montant} €<br>
                     Statut: ${statut}<br>
                </li>
            `;
                });
            } catch (error) {
                console.error('Erreur:', error);
                alert(error.message);
            }
        });

    </script>

</body>
</html>
